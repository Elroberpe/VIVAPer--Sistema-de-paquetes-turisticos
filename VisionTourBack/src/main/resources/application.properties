spring.application.name=visiontour-backend
spring.config.import=optional:file:./application-local.properties

server.port=${SERVER_PORT:8085}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vivaPeru_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

app.security.jwt.issuer=${JWT_ISSUER:vivaPeru}
app.security.jwt.audience=${JWT_AUDIENCE:vivaPeru-api}
app.security.jwt.secret=${JWT_SECRET:}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.auth.login-max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
app.auth.login-window=${AUTH_LOGIN_WINDOW:15m}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
spring.profiles.active=local